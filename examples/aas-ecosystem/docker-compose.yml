    container_name: ${PROJECT_NAME}-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aas-ecosystem.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      # Desktop-Modus: kein pgAdmin-Login, kein Master-Passwort (nur lokal erreichbar, siehe ports)
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # .local ist eine reservierte Domain und wird sonst vom E-Mail-Validator abgelehnt
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      PGADMIN_SERVER_JSON_FILE: /tmp/pgadmin/servers.json
      TWINENGINE_DB_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /tmp/pgadmin
        printf '%s\n' "postgres:5432:*:${POSTGRES_USER}:$$TWINENGINE_DB_PASSWORD" > /tmp/pgadmin/pgpass
        chmod 600 /tmp/pgadmin/pgpass
        cat >/tmp/pgadmin/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "TwinEngine",
              "Group": "AAS Ecosystem",
              "Host": "postgres",
              "Port": 5432,
              "MaintenanceDB": "${TWINENGINE_POSTGRES_DB:-twinengine}",
              "Username": "${POSTGRES_USER}",
              "PassFile": "/tmp/pgadmin/pgpass",
              "SSLMode": "prefer"
            }
          }
        }
        EOF
        exec /entrypoint.sh
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - aas-ecosystem-network
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    restart: unless-stopped

#### TODO: proxy konfigurieren
  proxy:
    container_name: aas-proxy
    image: ghcr.io/meta-level-public/aasdemoproxy:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: always
    env_file:
      - .env.proxy # ProxyConfiguration aus Umgebungsvariablen laden
    networks:
      - aas-ecosystem-network

networks:
  aas-ecosystem-network:
    driver: bridge

volumes:
  aas-ecosystem-postgres:
    driver: local
  keycloak-realm-import:
    driver: local
  twinengine-config-data:
    driver: local
  pgadmin-data:
    driver: local
  gateway-data-protection:
    driver: local
  designer-storage:
    driver: local
