<div class="modal-backdrop fade show"></div>
<div class="modal fade show d-block" tabindex="-1" (click)="onOutsideClick($event)">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" [class]="sizeClass()">
    <div class="modal-content" role="dialog" aria-modal="true" [attr.aria-label]="title()">
      <div class="modal-header">
        <h2 class="modal-title fs-5 text-truncate">{{ title() }}</h2>
        <button type="button" class="btn-close" aria-label="Close" (click)="closed.emit()"></button>
      </div>
      <div class="modal-body">
        <ng-content />
      </div>
      <div class="modal-footer">
        <ng-content select="[modal-actions]" />
      </div>
    </div>
  </div>
</div>
