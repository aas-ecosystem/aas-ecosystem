name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. **Do not include secrets or confidential data.**
        Security vulnerabilities must **not** be reported here, see `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: What is wrong?
      description: Short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical – crash, data loss or blocks development
        - High – major loss of function
        - Medium – loss of function under specific circumstances
        - Low – trivial problem
      default: 2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET version, Docker version, browser, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
    validations:
      required: false
